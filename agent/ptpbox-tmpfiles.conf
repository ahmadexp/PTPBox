# Volatile runtime paths required before the observation service starts.
#
# /run/ptpbox holds both root-owned control state (namespace-verified PHC map,
# management sockets, servo and fault requests) and the unprivileged collector's
# SQLite sample ring. The collector runs as the operator, so it must be able to
# create files here; without group write it cannot open its store at all and
# raw acquisition stops after every reboot.
#
# The sticky bit is what keeps that safe: the operator can add its own files but
# cannot unlink or rename the root-owned control state.
d /run/netns 0755 root root -
d /run/ptpbox 1775 root @PTPBOX_GROUP@ -
